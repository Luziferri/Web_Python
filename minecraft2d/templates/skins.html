{% extends "base.html" %}
{% block title %}Skins · Minecraft 2D{% endblock %}

{% block content %}
<section class="caixa-ecra-todo">
    <div class="titulo-ranking-centro">
        <h2>Loja de Skins</h2>
        <p>Escolhe a tua skin!</p>
    </div>

    <div class="skins-grid">
        {% for key, skin in skins.items() %}
        <div class="skin-card" data-skin="{{ key }}">
            <div class="skin-preview">
                <img src="{{ url_for('static', filename='img/' + skin.img) }}"
                     alt="{{ skin.name }}"
                     class="skin-img"
                     {% if skin.filter %}style="filter: {{ skin.filter }}"{% endif %}>
            </div>
            <div class="skin-info">
                <h3>{{ skin.name }}</h3>
                <p>{{ skin.desc }}</p>
            </div>
            <button class="skin-select-btn" data-skin="{{ key }}">Selecionar</button>
        </div>
        {% endfor %}
    </div>

    <p id="skin-status" class="skin-status"></p>
</section>

<script>
    var currentSkin = null;

    function carregarSkins() {
        fetch("{{ url_for('game.api_skins') }}")
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                currentSkin = data.current_skin;
                atualizarUI();
            })
            .catch(function(erro) {
                console.error("Erro ao carregar skins:", erro);
            });
    }

    function atualizarUI() {
        var cards = document.querySelectorAll(".skin-card");
        for (var i = 0; i < cards.length; i++) {
            var card = cards[i];
            var skin = card.getAttribute("data-skin");
            var btn = card.querySelector(".skin-select-btn");
            if (skin === currentSkin) {
                card.classList.add("skin-selected");
                btn.textContent = "Ativa";
                btn.disabled = true;
            } else {
                card.classList.remove("skin-selected");
                btn.textContent = "Selecionar";
                btn.disabled = false;
            }
        }
        var status = document.getElementById("skin-status");
        if (currentSkin) {
            var cards2 = document.querySelectorAll(".skin-card[data-skin='" + currentSkin + "'] h3");
            var nome = currentSkin;
            if (cards2.length > 0) {
                nome = cards2[0].textContent;
            }
            status.textContent = "Skin ativa: " + nome;
        }
    }

    function selecionarSkin(skin) {
        fetch("{{ url_for('game.api_skin_select') }}", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({skin: skin})
        })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.ok) {
                    currentSkin = data.skin;
                    atualizarUI();
                }
            })
            .catch(function(erro) {
                console.error("Erro ao selecionar skin:", erro);
            });
    }

    var botoes = document.querySelectorAll(".skin-select-btn");
    for (var i = 0; i < botoes.length; i++) {
        (function(btn) {
            btn.onclick = function() {
                if (btn.disabled) return;
                var skin = btn.getAttribute("data-skin");
                selecionarSkin(skin);
            };
        })(botoes[i]);
    }

    carregarSkins();
</script>
{% endblock %}
