{% extends "base.html" %}
{% block title %}Ranking · Minecraft 2D{% endblock %}

{% block content %}
<!-- QUADRADO GRANDE (Fundo): Ocupa a tela toda -->
<section class="caixa-ecra-todo">
    
    <!-- TEXTO NO TOPO -->
    <div class="titulo-ranking-centro">
        <h2>Leaderboard (Top 10)</h2>
        <p>Jogadores com mais recursos acumulados!</p>
    </div>
    
    <!-- QUADRADO DOS JOGADORES: Cresce à medida que entram pessoas -->
    <div class="inventory-panel caixa-dos-jogadores">
        <ul id="ranking-list" class="ranking-list">
            <!-- Os itens serão injetados aqui via JavaScript -->
        </ul>
    </div>

</section>

<script id="leaderboard-config" type="application/json">{"apiLeaderboard": "{{ url_for('game.api_leaderboard') }}"}</script>
<script src="{{ url_for('static', filename='js/leaderboard.js') }}"></script>
{% endblock %}
