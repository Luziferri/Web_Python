{% extends "base.html" %}
{% block title %}Ranking · Minecraft 2D{% endblock %}

{% block content %}
<section class="slots-section">
    <div class="section-header" caixa-titulo-ranking style="min-height: 80vh; width: 100%; display: flex; flex-direction: column;">
        <h2>Leaderboard</h2>
        <p>Jogadores com mais recursos acumulados!</p>
    </div>
    
    <div class="inventory-panel" style="margin-top: 1rem; width: 100%; max-width: 600px;">
        <ul id="ranking-list" class="ranking-list">
            </ul>
    </div>
</section>

<script>
    function atualizarRanking() {
        fetch("{{ url_for('game.api_leaderboard') }}")
            .then(response => response.json())
            .then(data => {
                let lista = document.getElementById("ranking-list");
                lista.innerHTML = ""; 

                for (let i = 0; i < data.ranking.length; i++) {
                    let jogador = data.ranking[i];
                    
                    let li = document.createElement("li");
                    li.classList.add("ranking-item");

                    let posicao = i + 1;
                    
                    // Criar spans separados para nome e pontuação
                    let spanInfo = document.createElement("span");
                    let spanPontos = document.createElement("span");
                    
                    let textoPrefixo = posicao + "º ";

                    if (posicao === 1) {
                        li.classList.add("badge-1");
                        textoPrefixo = "🥇 " + textoPrefixo;
                    } else if (posicao === 2) {
                        li.classList.add("badge-2");
                        textoPrefixo = "🥈 " + textoPrefixo;
                    } else if (posicao === 3) {
                        li.classList.add("badge-3");
                        textoPrefixo = "🥉 " + textoPrefixo;
                    }

                    spanInfo.textContent = textoPrefixo + jogador.username;
                    spanPontos.textContent = jogador.score + " pts";
                    
                    // Adicionar as duas partes ao cartão
                    li.appendChild(spanInfo);
                    li.appendChild(spanPontos);
                    
                    lista.appendChild(li);
                }
            })
            .catch(erro => console.error("Erro ao carregar o ranking:", erro));
    }

    atualizarRanking();
    setInterval(atualizarRanking, 5000);
</script>
{% endblock %}
